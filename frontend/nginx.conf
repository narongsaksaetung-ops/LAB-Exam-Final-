server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy API calls to backend — must come BEFORE the static-file cache rule
    # so that /api/attachments/file/*.jpg is forwarded to Node, not served as static
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Forward the Authorization header so authenticated image endpoints work
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # Proxy Socket.IO WebSocket
    location /socket.io/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }

    # SPA routing — catch-all for frontend routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache ONLY static build assets (js/css/fonts/icons), NOT /api/ paths.
    # The regex below only matches files that actually exist in the html root,
    # so it will never catch proxied API URLs.
    location ~* \.(js|css|woff|woff2|ttf|eot|ico|svg)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    server_tokens off;
}
